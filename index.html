<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Turnos HU-UNIVASF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Quadro de plantão do bloco: faixa de datas no topo, um cartão por período, HU (azul) e Policlínica (verde) como no mapa impresso */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#14212e; --muted:#5b6b7a; --line:#d5dce3;
  --hu:#1f4e79; --hu-soft:#ddebf7; --po:#375623; --po-soft:#e2efda; --night:#2b3640;
  --accent:#b8860b; --today:#14212e; --today-ink:#ffffff; --open-bg:#fff2cc; --open-ink:#7f6000;
  --ok:#2e6b3a; --ok-bg:#e2efda; --warn-bg:#fff2cc; --warn:#7f6000; --bad:#9c0006; --bad-bg:#ffd5d9;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --card:#17212b; --ink:#e7edf3; --muted:#9aa9b7; --line:#2a3744;
  --hu:#8fb8e3; --hu-soft:#1c3247; --po:#9ccc7a; --po-soft:#1f3320; --night:#c3cdd6;
  --accent:#e0b44a; --today:#e7edf3; --today-ink:#0f161d; --open-bg:#3a3214; --open-ink:#f2d27a;
  --ok:#9ccc7a; --ok-bg:#1f3320; --warn-bg:#3a3214; --warn:#f2d27a; --bad:#ff9aa5; --bad-bg:#3d1a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --card:#17212b; --ink:#e7edf3; --muted:#9aa9b7; --line:#2a3744;
  --hu:#8fb8e3; --hu-soft:#1c3247; --po:#9ccc7a; --po-soft:#1f3320; --night:#c3cdd6;
  --accent:#e0b44a; --today:#e7edf3; --today-ink:#0f161d; --open-bg:#3a3214; --open-ink:#f2d27a;
  --ok:#9ccc7a; --ok-bg:#1f3320; --warn-bg:#3a3214; --warn:#f2d27a; --bad:#ff9aa5; --bad-bg:#3d1a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:12px}
h1{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.upd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:54px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 8px;text-align:center;cursor:pointer;font:inherit}
.day b{display:block;font-family:var(--f-disp);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.day span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day.sel{background:var(--today);color:var(--today-ink);border-color:var(--today)}
.day.sel span{color:inherit;opacity:.8}
.day.hoje:not(.sel){border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.day:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.nav h2{font-family:var(--f-disp);font-weight:600;font-size:22px;margin:0}
.nav h2 em{font-style:normal;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--bad);margin-left:6px}
.nav .btns{display:flex;gap:6px}
.nav button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.per{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.per.agora{border-color:var(--accent)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600}
.ph h3 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--accent)}
.pb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0}
@media (max-width:600px){.pb{grid-template-columns:minmax(0,1fr)}.anest{border-left:0!important;border-top:1px solid var(--line)}}
.salas,.anest{padding:12px 14px;min-width:0}
.anest{border-left:1px solid var(--line)}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:6px}
.lab.hu{color:var(--hu)} .lab.po{color:var(--po)} .lab.an{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border-radius:6px;padding:4px 8px;font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.02em;border:1px solid rgba(0,0,0,.06)}
.chip small{font-family:var(--f-body);font-weight:500;font-size:10px;opacity:.75;letter-spacing:.04em}
.chip.susp{text-decoration:line-through;opacity:.6}
.unit-hu{border-left:3px solid var(--hu);padding-left:8px}
.unit-po{border-left:3px solid var(--po);padding-left:8px}
.empty{color:var(--muted);font-size:13px;margin:0 0 10px}
ul.nm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.nm li{font-weight:500}
ul.nm li.aberto{color:var(--open-ink);background:var(--open-bg);border-radius:6px;padding:1px 6px;font-style:italic;align-self:flex-start}
ul.nm li.srpa::after,ul.nm li.clinico::after{content:" · SRPA";color:var(--muted);font-weight:400;font-size:12px}
.cov{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.cov.ok{color:var(--ok);background:var(--ok-bg)} .cov.warn{color:var(--warn);background:var(--warn-bg)} .cov.bad{color:var(--bad);background:var(--bad-bg)}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
footer{margin-top:16px;font-size:12px;color:var(--muted)}
.msg{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.per{transition:border-color .2s}}
</style>
<style>body{margin:0;font-size:15px;font-family:var(--f-body)}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Turnos HU-UNIVASF<small>Bloco cirúrgico HU e Policlínica · anestesistas por período</small></h1>
    <div class="upd" id="upd">Carregando…</div>
  </header>
  <div class="strip" id="strip" role="tablist" aria-label="Dias"></div>
  <div class="nav"><h2 id="dtitle"></h2><div class="btns"><button id="prev" type="button" aria-label="Dia anterior">‹ Anterior</button><button id="hoje" type="button">Hoje</button><button id="next" type="button" aria-label="Próximo dia">Próximo ›</button></div></div>
  <main id="day"><div class="msg">Carregando a escala…</div></main>
  <div class="leg" id="leg" aria-label="Especialidades"></div>
  <footer>Somente leitura. Alterações de turno são registradas pela chefia no mapa oficial. Dúvidas: chefia da UDE.</footer>
</div>
<script>
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOWL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const PER={M:['Manhã','07–13'],T:['Tarde','13–19'],N:['Noite','19–07']};
let D=null, idx=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(s){if(!s)return '—';const [a,b]=s.split(' ');const [y,m,d]=a.split('-');return `${d}/${m} ${b||''}`.trim()}
function periodoAgora(){const h=new Date().getHours();return h>=7&&h<13?'M':h>=13&&h<19?'T':'N'}
function hojeIdx(){const n=new Date();let t=ymd(n);if(n.getHours()<7){const y=new Date(n);y.setDate(y.getDate()-1);t=ymd(y)}const i=D.dias.findIndex(x=>x.d===t);return i<0?0:i}
function chip(t){const e=D.especialidades[t.esp]||{bg:'#d9d9d9',fg:'#222',nome:t.esp};const s=t.status!=='ATIVO';
  return `<span class="chip${s?' susp':''}" style="background:${e.bg};color:${e.fg}" title="${esc(e.nome)}${s?' — '+esc(t.status.toLowerCase()):''}"><small>${esc(t.posto)}</small>${esc(t.esp)}</span>`}
function strip(){const h=hojeIdx();$('#strip').innerHTML=D.dias.map((x,i)=>{const d=parse(x.d);
  return `<button class="day${i===idx?' sel':''}${i===h?' hoje':''}" role="tab" aria-selected="${i===idx}" data-i="${i}" type="button"><span>${DOW[d.getDay()]}</span><b>${String(d.getDate()).padStart(2,'0')}</b><span>${MES[d.getMonth()]}</span></button>`}).join('');
  const s=$('#strip .sel'); if(s) s.scrollIntoView({block:'nearest',inline:'center'})}
function render(){const x=D.dias[idx], d=parse(x.d), h=hojeIdx(), pa=periodoAgora();
  $('#dtitle').innerHTML=`${DOWL[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')} ${MES[d.getMonth()]}`+(x.feriado?`<em>${esc(x.feriado)}</em>`:'');
  $('#day').innerHTML=x.per.map(p=>{
    const hu=p.turnos.filter(t=>t.unid==='HU'), po=p.turnos.filter(t=>t.unid!=='HU');
    const agora=(idx===h&&p.p===pa);
    let cov='';
    if(D.mostrar_cobertura){const s=p.disp-p.dem;cov=`<span class="cov ${s<0?'bad':(p.nomes.some(n=>n.t==='aberto')?'warn':'ok')}">${p.dem} turnos · ${p.disp} anest.</span>`}
    const nomes=p.nomes.length?`<ul class="nm">${p.nomes.map(n=>`<li class="${n.t}">${esc(n.n)}</li>`).join('')}</ul>`:'<p class="empty">Sem anestesista na escala.</p>';
    return `<section class="per${agora?' agora':''}" aria-label="${PER[p.p][0]}">
      <div class="ph"><h3>${PER[p.p][0]}<span>${PER[p.p][1]}</span></h3>${agora?'<span class="tag">agora</span>':''}${cov}</div>
      <div class="pb">
        <div class="salas">
          <div class="unit-hu"><div class="lab hu">Bloco HU</div>${hu.length?`<div class="chips">${hu.map(chip).join('')}</div>`:'<p class="empty">Sem turno.</p>'}</div>
          ${p.p!=='N'||po.length?`<div class="unit-po"><div class="lab po">Policlínica</div>${po.length?`<div class="chips">${po.map(chip).join('')}</div>`:'<p class="empty">Sem turno.</p>'}</div>`:''}
        </div>
        <div class="anest"><div class="lab an">Anestesistas</div>${nomes}</div>
      </div></section>`}).join('');
  strip()}
function go(i){idx=Math.max(0,Math.min(D.dias.length-1,i));render()}
$('#strip').addEventListener('click',e=>{const b=e.target.closest('.day');if(b)go(+b.dataset.i)});
$('#prev').onclick=()=>go(idx-1);$('#next').onclick=()=>go(idx+1);$('#hoje').onclick=()=>go(hojeIdx());
fetch('dados.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{D=j;
  $('#upd').textContent=`Escala atualizada em ${fmt(D.escala_importada_em)}`;
  const used=new Set();D.dias.forEach(x=>x.per.forEach(p=>p.turnos.forEach(t=>used.add(t.esp))));
  $('#leg').innerHTML=[...used].sort().map(k=>{const e=D.especialidades[k]||{};return `<span class="chip" style="background:${e.bg};color:${e.fg}">${esc(k)}<small>${esc(e.nome||'')}</small></span>`}).join('');
  go(hojeIdx())}).catch(()=>{$('#day').innerHTML='<div class="msg">Não foi possível carregar a escala. Tente novamente em instantes.</div>';$('#upd').textContent=''});
</script>

</body>
</html>
